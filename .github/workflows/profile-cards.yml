name: Profile cards

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Render overview, composition, momentum, and rhythm
        uses: seijikohara/profile-cards-action@38ef607e10ff675448299c42932d2fda7ae1129c # v1.17.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: AlpKincak
          cards: overview,composition,momentum,rhythm
          layout: split
          output-dir: assets/profile-cards
          themes: light,dark
          palette: purple
          commit: true
          commit-message: "chore(profile): refresh activity cards [skip ci]"
